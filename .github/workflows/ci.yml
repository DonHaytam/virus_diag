name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8 .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app core pipeline utils scripts

      - name: Build model artifact
        run: python scripts/build_model.py --sortie build/model_logistique.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modele-logistique
          path: build/model_logistique.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modele-logistique
          path: build

      - name: Deployment stage
        run: |
          echo "Deployment stage completed"
          test -f build/model_logistique.json
          echo "Artefact validé : build/model_logistique.json"
          echo "Aucune cible cloud n'est configurée pour ce projet : étape pédagogique."
